services:
  redis:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - proxy_network

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - redis
      - gotenberg
      - tika
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_URL: https://paperless.azby.fr
      PAPERLESS_SECRET_KEY: IXF07yAVN583X3ekbhmgDcWn9/2mHBqfLA0fazswhxuihmoBTi+dmnHiVk6RD+i2
      PAPERLESS_TIME_ZONE: Europe/Paris
      PAPERLESS_OCR_LANGUAGE: fra
      USERMAP_UID: 1000
      USERMAP_GID: 1000
    labels:
      - traefik.enable=true
      - traefik.http.routers.paperless.rule=Host(`paperless.azby.fr`)
      - traefik.http.routers.paperless.entrypoints=websecure
      - traefik.http.routers.paperless.tls=true
      - traefik.http.routers.paperless.tls.certresolver=ovh
      - traefik.http.services.paperless.loadbalancer.server.port=8000
    networks:
      - proxy_network

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.25
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    networks:
      - proxy_network

  tika:
    image: docker.io/apache/tika:latest
    restart: unless-stopped
    networks:
      - proxy_network

volumes:
  redisdata: null

networks:
  proxy_network:
    external: true
