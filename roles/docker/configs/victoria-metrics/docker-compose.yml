services:
  victoria-metrics:
    container_name: victoriametrics
    image: victoriametrics/victoria-metrics:latest
    volumes:
      - ./data:/victoria-metrics-data
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - -storageDataPath=/victoria-metrics-data
      - -promscrape.config=/etc/prometheus/prometheus.yaml
    labels:
      - traefik.enable=true
      - traefik.http.routers.victoria-metrics.rule=Host(`victoria-metrics.azby.fr`)
      - traefik.http.routers.victoria-metrics.entrypoints=websecure
      - traefik.http.routers.victoria-metrics.tls=true
      - traefik.http.routers.victoria-metrics.tls.certresolver=ovh
      - traefik.http.services.victoria-metrics.loadbalancer.server.port=8428
    networks:
      - proxy_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1  # Version stable et performante
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true