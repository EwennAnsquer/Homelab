# tasks/post_nginx-proxy-manager.yml

- name: "NPM : Attendre que l'API soit prête"
  ansible.builtin.uri:
    url: "http://127.0.0.1:81/api/"
    status_code: 200
  register: api_check
  until: api_check.status == 200
  retries: 30
  delay: 3

- name: "NPM : Attendre que les tables soient créées par le conteneur"
  ansible.builtin.command:
    cmd: sqlite3 {{ env_dir }}/data/database.sqlite "SELECT name FROM sqlite_master WHERE type='table' AND name='certificate';"
  register: table_check
  until: '"certificate" in table_check.stdout'
  retries: 20
  delay: 3
  changed_when: false
  vars:
    env_dir: "{{ env_vars.DIR }}"

- name: "NPM : Injecter le certificat Wildcard Let's Encrypt comme Certificat DNS"
  ansible.builtin.command:
    cmd: >
      sqlite3 {{ env_dir }}/data/database.sqlite "
      INSERT OR REPLACE INTO certificate (id, created_on, modified_on, provider, nice_name, domain_names, expires_on, meta, owner_user_id, is_deleted) 
      VALUES (
        1, 
        datetime('now'), 
        datetime('now'), 
        'letsencrypt', 
        'Certificat-IaC', 
        '[\"*.{{ env_vars.DOMAINE_NAME }}\", \"{{ env_vars.DOMAINE_NAME }}\"]', 
        datetime('now', '+10 years'), 
        '{\"dns_provider\": \"ovh\", \"email\": \"admin@example.com\", \"letsencrypt_email\": \"admin@example.com\", \"certificate_key_path\": \"/etc/letsencrypt/live/{{ env_vars.DOMAINE_NAME }}/privkey.pem\", \"certificate_path\": \"/etc/letsencrypt/live/{{ env_vars.DOMAINE_NAME }}/fullchain.pem\"}', 
        1, 
        0
      );
      "
  vars:
    env_dir: "{{ env_vars.DIR }}"

- name: "NPM : Injecter le Proxy Host (lié au certificat ID 1 + Cache Assets & HSTS)"
  ansible.builtin.command:
    cmd: >
      sqlite3 {{ env_dir }}/data/database.sqlite "
      INSERT OR REPLACE INTO proxy_host 
      (id, created_on, modified_on, domain_names, forward_host, forward_port, access_list_id, certificate_id, ssl_forced, caching_enabled, allow_websocket_upgrade, block_exploits, advanced_config, meta, forward_scheme, enabled, http2_support, hsts_enabled, hsts_subdomains, owner_user_id, is_deleted) 
      VALUES 
      (1, datetime('now'), datetime('now'), '[\"{{ npm_domain }}\"]', '{{ npm_host }}', 81, 0, 1, 1, 0, 1, 1, '', '{}', 'http', 1, 0, 0, 0, 1, 0);
      "
  vars:
    env_dir: "{{ env_vars.DIR }}"
    npm_domain: "{{ env_vars.nginx_proxy_manager_domaine_name }}"
    npm_scheme: "{{ env_vars.nginx_proxy_manager_scheme }}"
    npm_host: "{{ env_vars.nginx_proxy_manager_hostname }}"
    npm_port: "{{ env_vars.nginx_proxy_manager_port }}"

- name: "NPM : Supprimer l'ancienne conf générée pour forcer la regénération"
  ansible.builtin.file:
    path: "{{ env_dir }}/data/nginx/proxy_host/1.conf"
    state: absent
  vars:
    env_dir: "{{ env_vars.DIR }}"

- name: "NPM : Créer le lien npm-<id> attendu par NPM vers le certificat réel"
  ansible.builtin.file:
    src: "{{ env_vars.DOMAINE_NAME }}"
    dest: "{{ env_vars.DIR }}/letsencrypt/live/npm-1"
    state: link
    force: true
  vars:
    env_dir: "{{ env_vars.DIR }}"

- name: "NPM : Redémarrer le conteneur pour générer le fichier .conf avec SSL"
  community.docker.docker_compose_v2:
    project_src: "{{ env_vars.DIR }}"
    state: restarted