services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      # Nécessaire pour le fonctionnement de base de Dockhand
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - EVENTS=1
      - POST=1
      - DELETE=1
      # Nécessaire pour le dashboard (infos hôte, usage disque)
      - INFO=1
      - SYSTEM=1
      # Nécessaire pour le scan de vulnérabilités et gestion des containers
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      # Optionnel : active l'accès terminal depuis Dockhand
      - EXEC=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy

networks:
  socket_proxy:
    external: true