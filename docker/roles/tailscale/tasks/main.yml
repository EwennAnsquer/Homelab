---
# roles/tailscale/tasks/main.yml

- name: "Système : Récupérer la configuration du conteneur courant"
  ansible.builtin.set_fact:
    current_ct: "{{ containers | selectattr('hostname', 'equalto', ansible_facts['hostname']) | first }}"

- name: Bloc de préparation Proxmox (tun device)
  block:
    - name: "Proxmox : trouver l'ID du LXC ciblé"
      ansible.builtin.command:
        cmd: "pct list"
      delegate_to: "proxmox-dell-optiplex"
      register: pct_list_result
      changed_when: false

    - name: "Proxmox : vérifier que lxc.mount.entry tun n'existe pas déjà"
      ansible.builtin.command:
        cmd: "grep -c 'dev/net/tun' /etc/pve/lxc/{{ current_ct.vm_id }}.conf"
      delegate_to: "proxmox-dell-optiplex"
      register: tun_already_present
      failed_when: false
      changed_when: false

    - name: "Proxmox : ajouter l'accès au device /dev/net/tun dans la config LXC"
      ansible.builtin.blockinfile:
        path: "/etc/pve/lxc/{{ current_ct.vm_id }}.conf"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - tailscale tun"
        block: |
          lxc.cgroup2.devices.allow: c 10:200 rwm
          lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
      delegate_to: "proxmox-dell-optiplex"
      register: lxc_conf_updated

    - name: "Proxmox : redémarrer le LXC si la config a changé"
      ansible.builtin.command:
        cmd: "pct reboot {{ current_ct.vm_id }}"
      delegate_to: "proxmox-dell-optiplex"
      when: lxc_conf_updated.changed

- name: "Attendre que le LXC soit de nouveau joignable en SSH"
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 60
  when: lxc_conf_updated.changed

- name: "Vérifier que /dev/net/tun est bien présent dans le LXC"
  ansible.builtin.command:
    cmd: "ls -la /dev/net/tun"
  register: tun_check
  changed_when: false

- name: "Afficher le résultat de la vérification"
  ansible.builtin.debug:
    var: tun_check.stdout

- name: "Tailscale : ajouter la clé GPG"
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'

- name: "Tailscale : ajouter le dépôt"
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: '0644'

- name: "Tailscale : installer le paquet"
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: yes

- name: "Tailscale : activer l'IP forwarding (nécessaire pour subnet router)"
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  ignore_errors: true

- name: "Tailscale : démarrer le service"
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: yes

- name: "Tailscale : connecter au tailnet en tant que subnet router"
  ansible.builtin.command:
    cmd: >
      tailscale up
      --authkey={{ tailscale.authkey }}
      --advertise-routes={{ tailscale.subnet_routes }}
      --accept-dns=false
  register: tailscale_up_result
  changed_when: "'Success' in tailscale_up_result.stdout or tailscale_up_result.rc == 0"