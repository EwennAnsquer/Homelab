---
- name: Installer et bootstrapper FluxCD sur le cluster
  hosts: localhost
  connection: local
  vars:
    kubeconfig_path: "{{ playbook_dir }}/../kubeconfig"

  tasks:
    - name: Vérifier si le CLI Flux est installé localement
      ansible.builtin.command: flux --version
      register: flux_cli
      ignore_errors: true
      changed_when: false

    - name: Installer le CLI Flux s'il est absent
      ansible.builtin.shell: curl -s https://fluxcd.io/install.sh | bash
      when: flux_cli.rc != 0

    - name: Exécuter le bootstrap FluxCD
      ansible.builtin.command: >
        flux bootstrap github
        --owner={{ git_owner }}
        --repository={{ git_repo }}
        --branch={{ git_branch }}
        --path={{ target_path }}
        --personal
        --token-auth
        --kubeconfig={{ kubeconfig_path }}
      environment:
        GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"