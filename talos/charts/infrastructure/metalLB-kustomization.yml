apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./talos/charts/infrastructure/metalLB/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  dependsOn:
    - name: metallb-app
  interval: 10m
  path: ./talos/charts/infrastructure/metalLB/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system