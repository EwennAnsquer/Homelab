apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  interval: 1h
  targetNamespace: cilium
  install:
    createNamespace: true
  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: fluxcd
  values:
    ipam:
      mode: kubernetes
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - FSETID
          - KILL
          - SETGID
          - SETUID
          - SETPCAP
          - NET_BIND_SERVICE
          - NET_ADMIN
          - NET_RAW
          - SYS_MODULE
          - SYS_RAWIO
          - SYS_RESOURCE
          - SYS_PTRACE
          - SYS_ADMIN
          - SYS_BOOT
          - SYS_NICE
          - SYS_TIME
          - SYS_TTY_CONFIG
          - MKNOD
          - AUDIT_WRITE
          - AUDIT_CONTROL
          - MAC_OVERRIDE
          - MAC_ADMIN
          - NET_BROADCAST
          - WAKE_ALARM
          - BLOCK_SUSPEND
          - AUDIT_READ
          - PERFMON
          - BPF
          - CHECKPOINT_RESTORE
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE