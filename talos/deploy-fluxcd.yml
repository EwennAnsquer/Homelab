---
- name: Installer et bootstrapper FluxCD sur le cluster
  hosts: localhost
  connection: local
  vars_files:
    - vars-fluxcd.yml

  tasks:
    - name: Vérifier si le CLI Flux est installé localement
      command: flux --version
      register: flux_cli
      ignore_errors: true
      changed_when: false

    - name: Installer le CLI Flux s'il est absent
      shell: curl -s https://fluxcd.io/install.sh | bash
      when: flux_cli.rc != 0

    - name: Exécuter le bootstrap FluxCD
      command: >
        flux bootstrap {{ git_provider }}
        --owner={{ git_owner }}
        --repository={{ git_repo }}
        --branch={{ git_branch }}
        --path={{ target_path }}
        --personal
        --kubeconfig=./kubeconfig
      environment:
        GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"